<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="운동">
<meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>운동</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#111;--sub:#6b6b75;--line:#e3e3e8;--ac:#2f6bff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#ececf1}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--card:#1c1c20;--tx:#f2f2f4;--sub:#9a9aa5;--line:#2c2c33;--chip:#2a2a31}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
h1{margin:0;font-size:26px}
main{padding:0 12px calc(env(safe-area-inset-bottom) + 150px)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{color:var(--sub);font-size:14px}
.tag{font-size:13px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--sub);white-space:nowrap}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--tx);padding:8px;border-radius:8px;font-size:15px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px #0002}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 12px;font-size:15px}
.chips button.next{border-color:var(--ac);color:var(--ac);font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;background:var(--ac);color:#fff;margin-top:10px}
.btn.gray{background:var(--chip);color:var(--tx)}
.btn.small{display:inline-block;width:auto;padding:8px 12px;font-size:15px;margin:0}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px}
.set input{width:100%;font-size:17px;padding:9px 8px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--tx);text-align:center}
.set .n{color:var(--sub);text-align:center;font-size:14px}
.ck{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--sub);font-size:20px}
.set.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done input{opacity:.6}
.set.opt .n{font-size:11px}
.lbl{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--sub)}
.lbl input{width:20px;height:20px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{width:22px;height:22px}
.hint{border-left:4px solid var(--warn);padding:10px 12px;background:var(--card);border-radius:10px;margin:10px 0;font-size:15px}
.hint.ok{border-color:var(--ok)}.hint.bad{border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:10px 0 8px;font-size:13px}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--ac)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 66px);background:var(--tx);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:8}
#timer[hidden]{display:none}
#timer .t{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;flex:1}
#timer button{border:0;border-radius:9px;padding:8px 10px;background:#fff3;color:inherit;font-size:15px}
#timer.end{background:var(--ok);color:#fff}
.guide h3{margin:16px 0 6px;font-size:17px}
.guide p,.guide li{font-size:15px}
.guide ul{padding-left:20px;margin:4px 0}
input[type=date],input[type=number].wide{font-size:17px;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--tx)}
</style>
</head>
<body>
<header><h1 id="ttl">오늘</h1></header>
<main id="view"></main>
<div id="timer" hidden><span class="t" id="tt">0:00</span><button id="tplus">+30초</button><button id="tclose">닫기</button></div>
<nav id="nav">
<button data-tab="today"><b>💪</b>오늘</button>
<button data-tab="weight"><b>⚖️</b>체중</button>
<button data-tab="log"><b>📋</b>기록</button>
<button data-tab="guide"><b>📖</b>가이드</button>
</nav>
<script>
"use strict";
// ---------- 루틴 정의 ----------
// t: bb 바벨, db 덤벨, mc 머신, bw 맨몸(추가 무게), sec 초
const E=(n,s,lo,hi,t,note)=>({n,s,lo,hi,t,note:note||''});
const DAYS={
'하체A':[E('스쿼트',3,6,8,'bb'),E('루마니안 데드',3,8,10,'bb'),E('불가리안 스플릿 스쿼트',3,8,10,'db','좌우 각각'),E('레그컬',3,10,12,'mc'),E('카프레이즈',3,12,15,'mc'),E('플랭크',3,40,40,'sec')],
'상체A':[E('벤치프레스',3,6,8,'bb'),E('시티드 로우',3,8,10,'mc'),E('덤벨 숄더프레스',3,8,10,'db'),E('랫풀다운',3,8,12,'mc'),E('사이드 레터럴',3,12,20,'db'),E('페이스풀',3,15,15,'mc'),E('바벨컬',2,10,12,'bb'),E('푸시다운',2,10,12,'mc')],
'하체B':[E('데드리프트',3,5,5,'bb','원판 작으면 받침 위'),E('레그프레스',3,10,12,'mc'),E('힙쓰러스트',3,8,12,'bb'),E('레그익스텐션',3,12,15,'mc'),E('워킹 런지',2,10,10,'db','좌우 각각'),E('카프레이즈',3,12,15,'mc'),E('케이블 크런치',3,12,12,'mc')],
'상체B':[E('풀업',3,6,10,'bw','안되면 어시스트나 랫풀다운'),E('인클라인 덤벨프레스',3,8,10,'db'),E('원암 덤벨로우',3,10,10,'db','좌우 각각'),E('딥스',3,8,12,'bw','안되면 체스트프레스 머신'),E('사이드 레터럴',3,12,20,'db'),E('리어델트 플라이',3,15,15,'mc'),E('해머컬',2,10,12,'db'),E('오버헤드 익스텐션',2,10,12,'db')],
'전신A':[E('스쿼트',3,6,8,'bb'),E('벤치프레스',3,6,8,'bb'),E('랫풀다운',3,8,12,'mc'),E('루마니안 데드',3,8,10,'bb'),E('사이드 레터럴',3,12,20,'db'),E('바벨컬',2,10,12,'bb'),E('플랭크',3,40,40,'sec')],
'전신B':[E('데드리프트',3,5,5,'bb','원판 작으면 받침 위'),E('덤벨 숄더프레스',3,8,10,'db'),E('시티드 로우',3,8,10,'mc'),E('불가리안 스플릿 스쿼트',3,8,10,'db','좌우 각각'),E('페이스풀',3,15,15,'mc'),E('푸시다운',2,10,12,'mc'),E('카프레이즈',3,12,15,'mc')],
'전신C':[E('레그프레스',3,10,12,'mc'),E('인클라인 덤벨프레스',3,8,10,'db'),E('풀업',3,6,10,'bw','안되면 랫풀다운'),E('레그컬',3,10,12,'mc'),E('딥스',3,8,12,'bw'),E('해머컬',2,10,12,'db'),E('힙쓰러스트',3,8,12,'bb')]
};
const PLANS={4:['하체A','상체A','하체B','상체B'],3:['전신A','전신B','전신C']};
const START_W={'벤치프레스':40,'스쿼트':20,'루마니안 데드':25,'데드리프트':30};
const INC={bb:'+2.5kg',db:'한 손 +1~2kg',mc:'한 칸'};
const REST={bb:150,db:75,mc:75,bw:90,sec:60};
const FOOD=['기본 : 3끼 + 프로틴 2스쿱(물)','1단계 : 프로틴 1번을 우유 400ml에','2단계 : 1단계 + 저녁 밥 2/3공기'];

// ---------- 저장 ----------
const KEY='workout_v1';
const DEF={plan:4,start:'2026-11-23',short:false,light:false,logs:[],wt:{},waist:{},chk:{},food:0,draft:null,tab:'today'};
let D;
function clean(x){
 const o=Object.assign({},DEF,{logs:[],wt:{},waist:{},chk:{},draft:null});if(!x||typeof x!=='object')return o;
 const isD=k=>/^\d{4}-\d{2}-\d{2}$/.test(k),num=v=>typeof v==='number'&&isFinite(v);
 if(x.plan===3||x.plan===4)o.plan=x.plan;
 if(typeof x.start==='string'&&isD(x.start))o.start=x.start;
 o.short=!!x.short;o.light=!!x.light;o.food=[0,1,2].includes(x.food)?x.food:0;
 if(typeof x.foodAt==='string'&&isD(x.foodAt))o.foodAt=x.foodAt;
 if(Number.isInteger(x.lastLight))o.lastLight=x.lastLight;
 for(const k of ['wt','waist'])if(x[k]&&typeof x[k]==='object')for(const [d,v] of Object.entries(x[k]))if((isD(d)||/^\d{4}-\d{2}$/.test(d))&&num(v))o[k][d]=v;
 if(x.chk&&typeof x.chk==='object')for(const [d,v] of Object.entries(x.chk))if(isD(d)&&v&&typeof v==='object'){o.chk[d]={};for(const [k,b] of Object.entries(v))if(/^[a-z0-9]+$/.test(k))o.chk[d][k]=!!b}
 const names=new Set(Object.values(DAYS).flat().map(e=>e.n));
 const okSets=a=>Array.isArray(a)?a.filter(t=>t&&typeof t==='object').map(t=>({w:num(t.w)?t.w:'',r:num(t.r)?t.r:0})):[];
 if(Array.isArray(x.logs))o.logs=x.logs.filter(l=>l&&DAYS[l.day]&&isD(l.date)&&Array.isArray(l.ex)).map(l=>({ts:num(l.ts)?l.ts:Date.parse(l.date),date:l.date,day:l.day,short:!!l.short,light:!!l.light,week:Number.isInteger(l.week)?l.week:0,ex:l.ex.filter(e=>e&&names.has(e.n)).map(e=>({n:e.n,planned:Number.isInteger(e.planned)?e.planned:0,hard:!!e.hard,sets:okSets(e.sets)}))}));
 if(x.draft&&DAYS[x.draft.day]&&isD(x.draft.date)&&Array.isArray(x.draft.ex)&&x.draft.ex.every(e=>e&&names.has(e.n)&&Array.isArray(e.sets)))o.draft={day:x.draft.day,date:x.draft.date,short:!!x.draft.short,light:!!x.draft.light,week:Number.isInteger(x.draft.week)?x.draft.week:0,ex:x.draft.ex.map(e=>({n:e.n,hard:!!e.hard,sets:e.sets.map(t=>({w:String(t.w??'').replace(/[^0-9.]/g,''),r:String(t.r??'').replace(/[^0-9]/g,''),done:!!t.done,opt:!!t.opt}))}))};
 if(['today','weight','log','guide'].includes(x.tab))o.tab=x.tab;
 return o;
}
{const raw=localStorage.getItem(KEY);
 try{D=clean(JSON.parse(raw||'{}'))}catch(e){if(raw)localStorage.setItem(KEY+'_broken_'+Date.now(),raw);D=clean({});alert('저장된 기록을 읽지 못해 따로 보관했습니다. 기록 탭에서 백업을 불러와 주세요.')}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){alert('저장 실패 : 저장 공간을 확인해 주세요');return false}};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

// ---------- 날짜 ----------
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const dayDiff=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
const addDays=(a,n)=>{const d=new Date(a+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const wkOf=(d)=>{const x=dayDiff(d,D.start);return x<0?0:Math.floor(x/7)+1};
const md=s=>{const [y,m,d]=s.split('-');return +m+'/'+(+d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function rule(w){w=Math.max(w,1);
 if(w===1)return{sets:2,left:4,t:'복귀 1주차 : 2세트만, 4개 남기고 끝'};
 if(w===2)return{sets:3,opt:true,left:3,t:'복귀 2주차 : 2~3세트, 3개 남기고 끝 (3세트째는 선택)'};
 if(w<=4)return{sets:3,left:2,t:w+'주차 : 3세트, 2개 남기고 끝'};
 return{sets:3,left:'1~2',t:w+'주차 : 3세트, 1~2개 남기고 끝'};}
function setCount(ex,light,w){let n=Math.min(ex.s,rule(w).sets);if(light)n=Math.max(1,Math.ceil(n/2));return n}

// ---------- 다음 운동 ----------
function lastOfPlan(){return D.logs.filter(l=>PLANS[D.plan].includes(l.day)).sort((a,b)=>b.ts-a.ts)[0]}
function nextDay(){const l=lastOfPlan();const p=PLANS[D.plan];if(!l)return p[0];return p[(p.indexOf(l.day)+1)%p.length]}

// ---------- 무게 제안 ----------
function history(name,all){const out=[];for(const l of [...D.logs].sort((a,b)=>b.ts-a.ts)){if(l.light&&!all)continue;const e=l.ex.find(x=>x.n===name);if(e&&e.sets.length)out.push({date:l.date,...e})}return out}
function suggest(ex){
 const h=history(ex.n);
 if(!h.length){if(START_W[ex.n]!=null)return{w:START_W[ex.n],msg:'첫 세트 무게 (봉 20kg 포함). 해 보고 바로 조정'};
  if(ex.t==='sec')return{w:'',msg:'버틸 수 있는 만큼, 목표 '+ex.hi+'초'};
  if(ex.t==='bw')return{w:'',msg:'맨몸이면 무게 칸 비우기'};
  return{w:'',msg:'12~13회 할 수 있는 무게로 시작'};}
 const last=h[0],ws=last.sets.map(s=>+s.w||0),lw=Math.max(...ws);
 const prevTxt=md(last.date)+' '+(lw?lw+'kg ':'')+last.sets.map(s=>s.r).join(',');
 if(ex.t==='sec')return{w:'',msg:'지난번 '+prevTxt+'초'};
 const allTop=last.sets.length>=last.planned&&last.sets.every(s=>+s.r>=ex.hi&&(+s.w||0)===lw);
 const below=last.sets.some(s=>+s.r<ex.lo);
 if(below&&h[1]){const pw=Math.max(...h[1].sets.map(s=>+s.w||0));if(pw<lw)return{w:pw,msg:'지난번 '+prevTxt+' 범위 첫 숫자 못 채움 → 원래 '+pw+'kg로'}}
 if(last.hard)return{w:lw||'',msg:'지난번 '+prevTxt+' (버거웠음) → 같은 무게'};
 if(allTop){
  if(ex.t==='bb')return{w:lw+2.5,msg:'지난번 '+prevTxt+' 다 채움 → +2.5kg',up:true};
  if(ex.t==='db')return{w:lw+1,msg:'지난번 '+prevTxt+' 다 채움 → 한 손 +1~2kg',up:true};
  if(ex.t==='bw')return{w:lw||'',msg:'지난번 '+prevTxt+' 다 채움 → 추가 무게 또는 보조 줄이기',up:true};
  return{w:lw,msg:'지난번 '+prevTxt+' 다 채움 → 한 칸 올리기',up:true};}
 let stall='';
 if(h[1]&&JSON.stringify(h[0].sets.map(s=>[+s.w,+s.r]))===JSON.stringify(h[1].sets.map(s=>[+s.w,+s.r])))stall=' (2번 연속 그대로 → 가벼운 주 고려)';
 return{w:lw||'',msg:'지난번 '+prevTxt+' → 같은 무게로 한 번 더'+stall};
}

// ---------- 운동 진행 ----------
function startDraft(day){
 const w=wkOf(today());
 const list=DAYS[day].filter((_,i)=>!D.short||i<4);
 D.draft={day,date:today(),short:D.short,light:D.light,week:w,ex:list.map(ex=>{const s=suggest(ex);const n=setCount(ex,D.light,w);
  const sets=[];for(let i=0;i<n;i++)sets.push({w:s.w,r:'',done:false,opt:rule(w).opt&&!D.light&&i===2&&ex.s>=3});
  return{n:ex.n,sets,hard:false}})};
 save();render();window.scrollTo(0,0);
}
function finish(){
 const d=D.draft;const ex=d.ex.map(e=>{const def=findEx(d.day,e.n);return{n:e.n,planned:e.sets.filter(s=>!s.opt).length,hard:e.hard,sets:e.sets.filter(s=>s.done).map(s=>({w:s.w===''||isNaN(+s.w)?'':+s.w,r:s.r===''||isNaN(+s.r)?def.hi:+s.r}))}}).filter(e=>e.sets.length);
 if(!ex.length){if(!confirm('체크한 세트가 없습니다. 기록 없이 끝낼까요?'))return;D.draft=null;save();render();return}
 D.logs.push({ts:Date.now(),date:d.date,day:d.day,short:d.short,light:d.light,week:d.week,ex});
 const keepLight=D.lastLight;if(d.light)D.lastLight=d.week;
 const keepDraft=D.draft;D.draft=null;
 if(!save()){D.logs.pop();D.draft=keepDraft;D.lastLight=keepLight;return}
 stopTimer();render();window.scrollTo(0,0);
}
function findEx(day,n){return DAYS[day].find(x=>x.n===n)}

// ---------- 휴식 타이머 ----------
let tEnd=0,tInt=null;
function startTimer(sec){tEnd=Date.now()+sec*1000;$('#timer').hidden=false;$('#timer').classList.remove('end');if(!tInt)tInt=setInterval(tick,300);tick()}
function stopTimer(){clearInterval(tInt);tInt=null;$('#timer').hidden=true}
function tick(){const r=Math.round((tEnd-Date.now())/1000);const el=$('#tt');
 if(r<=0){el.textContent='다음 세트!';if(!$('#timer').classList.contains('end')){$('#timer').classList.add('end');navigator.vibrate&&navigator.vibrate(300)}return}
 el.textContent='휴식 '+Math.floor(r/60)+':'+pad(r%60)}
function $(s){return document.querySelector(s)}

// ---------- 화면 ----------
const V=$('#view');
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===D.tab));
 $('#ttl').textContent={today:'오늘',weight:'체중',log:'기록',guide:'가이드'}[D.tab];
 V.innerHTML=({today:vToday,weight:vWeight,log:vLog,guide:vGuide}[D.tab])();
}
function vToday(){
 const t=today(),w=wkOf(t),r=rule(w);let h='';
 if(!navigator.standalone&&!matchMedia('(display-mode: standalone)').matches)h+='<div class="hint">사파리 아래 공유 버튼 → <b>홈 화면에 추가</b>를 누르면 앱처럼 열리고 기록도 안전하게 남습니다.</div>';

function weekAvgs(){const by={};for(const [d,kg] of Object.entries(D.wt)){const w=wkOf(d);if(w<1)continue;(by[w]=by[w]||[]).push(+kg)}
 const out={};for(const w in by)out[w]=by[w].reduce((a,b)=>a+b,0)/by[w].length;return out}
function advice(){
 const cur=wkOf(today()),A=weekAvgs(),c=cur-1;
 if(c<3)return{cls:'',t:'첫 2주는 수분으로 빨리 늘 수 있어 판단하지 않습니다. 3주차가 끝나면 판단합니다.'};
 if(D.foodAt){const fw=wkOf(D.foodAt);if(c<fw+2)return{cls:'',t:md(D.foodAt)+'에 먹는 양을 바꿨습니다. 바꾼 뒤 2주가 지나야 다시 판단합니다.'}}
 const dl=w=>(A[w]!=null&&A[w-1]!=null)?A[w]-A[w-1]:null;
 const d1=dl(c),d2=c-1>=3?dl(c-1):null;
 if(d1==null)return{cls:'',t:'지난주 또는 그 전 주 체중 기록이 없어 판단할 수 없습니다.'};
 const f=x=>(x>=0?'+':'')+x.toFixed(2)+'kg';
 if(d2!=null&&d1<0.1&&d2<0.1)return{cls:'bad',t:'2주 연속 '+f(d2)+', '+f(d1)+' → 한 단계 더 먹기'+(D.food>=2?' (이미 2단계 : 간식 하나 더)':''),act:'up'};
 if(d2!=null&&d1>0.4&&d2>0.4)return{cls:'bad',t:'2주 연속 '+f(d2)+', '+f(d1)+' → 마지막에 더한 것 하나 빼기',act:'down'};
 if(d1>=0.15&&d1<=0.3)return{cls:'ok',t:'지난주 '+f(d1)+' → 딱 좋음. 그대로'};
 return{cls:'',t:'지난주 '+f(d1)+' → 그대로 두고 다음 주 다시 보기'};
}

 if(t.dataset.chk){const d=today();D.chk[d]=D.chk[d]||{};D.chk[d][t.dataset.chk]=t.checked;save();render();return}
 if(t.dataset.hard!=null){D.draft.ex[+t.dataset.hard].hard=t.checked;save();return}
 if(t.id==='startin'&&t.value){D.start=t.value;save();render();return}
 if(t.id==='imp'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{let x;try{x=JSON.parse(fr.result);if(!x||!Array.isArray(x.logs))throw 0}catch(err){alert('백업 파일이 아닙니다');return}
  const n=clean(x);if(confirm('백업(운동 '+n.logs.length+'회, 체중 '+Object.keys(n.wt).length+'일)으로 지금 기록을 바꿀까요?')){const old=D;D=n;try{render()}catch(err){D=old;render();alert('백업을 열 수 없습니다');return}save()}};fr.readAsText(t.files[0])}
});
V.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&D.draft){const st=D.draft.ex[+t.dataset.e].sets[+t.dataset.s];st[t.dataset.f]=t.value.replace(',','.');save()}});
async function exportData(){
 const name='운동기록_'+today()+'.json';const blob=new Blob([JSON.stringify(D)],{type:'application/json'});
 const file=new File([blob],name,{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
render();
</script>
