<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="운동">
<meta name="theme-color" content="#1F5BFF">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>운동</title>
<style>
@font-face{font-family:Anton;src:url(fonts/anton.woff2) format("woff2");font-display:swap}
:root{color-scheme:light;--paper:#EEF3F8;--card:#FFFFFF;--paper2:#DCE6F2;--ink:#0B0F1A;--sub:#3D4A5C;--dim:#3D4A5C;--red:#1F5BFF;--sun:#FFC400;--navy:#1F5BFF;--ok:#1F6B3A;--bad:#C42A1F;--warn:#C42A1F;--line:#0B0F1A;--ac:#1F5BFF;--ac2:#FFC400;--ac2t:#1F6B3A;--acrgb:31,91,255;--ac2rgb:255,196,0;--on:#0B0F1A;--tx:#0B0F1A;--s1:#FFFFFF;--s2:#DCE6F2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom));background:var(--paper)}
.disp{font-family:Anton,"Arial Narrow",Impact,sans-serif;font-weight:400;letter-spacing:.01em;text-transform:uppercase}
.bgfx{display:none}
header{background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 20px 16px;border-bottom:6px solid var(--sun)}
.eyebrow{font-size:13px;font-weight:700;color:#fff;letter-spacing:.04em}
.eyebrow:before{content:"WOO'S GYM";font-family:Anton,"Arial Narrow",sans-serif;font-size:15px;letter-spacing:.06em;color:#fff;margin-right:10px}
h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
body[data-tab="today"]:not(.in-workout) header{display:none}
body.in-workout h1{font-size:24px}
main{padding:12px 16px 24px;max-width:560px;margin:0 auto}
body[data-tab="today"]:not(.in-workout) main{padding-top:0}
h2,h3{margin:0;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:transparent;border:0;border-top:3px solid var(--ink);border-radius:0;padding:14px 0 4px;margin:24px 0 8px;box-shadow:none}.card.ex{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:16px;margin:16px 0}
.h{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:10px;letter-spacing:.02em;display:flex;align-items:center}
.h:before{content:"";width:10px;height:10px;background:var(--red);margin-right:8px;flex:none}
.sub{font-size:14px;color:var(--sub)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1.5px solid var(--ink);border-radius:4px;background:transparent;color:var(--ink);font-size:13px;font-weight:800;white-space:nowrap}
.pill.ac{background:var(--navy);border-color:var(--navy);color:#fff}
.note{background:var(--paper2);border:0;border-radius:6px;padding:12px 14px;margin:16px 0;font-size:15px;font-weight:700}
.note.warn,.note.bad{background:#FDE7E4;color:#8E1D14}.note.ac{background:#DDF3E3;color:#15532B}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin:12px 0 0;border:2px solid var(--ink);border-radius:6px;background:var(--sun);color:var(--ink);font-size:18px;font-weight:900;box-shadow:4px 4px 0 var(--ink);padding:0 16px;letter-spacing:.01em}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.sm{min-height:44px;width:auto;font-size:15px;margin:0;box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.danger{background:var(--card);color:var(--bad)}
.btn.big{min-height:64px;font-size:21px}
.btn.done{background:var(--sun);color:var(--ink);min-height:60px;font-size:21px}
.text-link{display:block;margin:8px auto 0;background:none;border:0;font-size:15px;font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;padding:8px 12px;min-height:44px}
.chipbtn{min-height:44px;padding:0 14px;border-radius:6px;border:2px solid var(--ink);background:var(--card);font-size:14px;font-weight:800}
.chipbtn.on{background:var(--ink);color:var(--paper)}
.seg{display:flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;border-left:2px solid var(--ink);background:var(--card);font-size:15px;font-weight:800}
.seg button:first-child{border-left:0}.seg button.on{background:var(--ink);color:var(--paper)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #C9D4E2;font-size:15px;font-weight:700}
.toggle small{display:block;font-size:13px;color:var(--sub);font-weight:500}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:4px;border:2px solid var(--ink);background:var(--paper2);position:relative;flex:none;margin:0}
.sw:before{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:2px;background:var(--ink);transition:transform .15s}
.sw:checked{background:var(--red)}.sw:checked:before{transform:translateX(22px);background:#fff}
.chk{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid #C9D4E2;font-size:16px;font-weight:700}
.chk input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:3px;border:2px solid var(--ink);background:var(--card);margin:0;flex:none;display:grid;place-items:center}
.chk input:checked{background:var(--ink)}
.chk input:checked:after{content:"";width:7px;height:13px;border:solid var(--paper);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.chk input:checked+span{color:var(--sub);text-decoration:line-through;text-decoration-thickness:2px}
.inp{width:100%;min-height:48px;border:2px solid var(--ink);border-radius:6px;background:var(--card);padding:0 12px;font-size:16px;color:var(--ink)}
.f{display:block;font-size:14px;font-weight:800;margin:14px 0 6px}
.field{display:flex;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:0 10px;min-height:48px}
.field input{width:100%;border:0;background:transparent;font-size:18px;font-weight:800;color:var(--ink);min-width:0;padding:8px 0;font-variant-numeric:tabular-nums}
.field i{font-style:normal;font-size:14px;color:var(--sub);margin-left:4px}
.set{display:grid;grid-template-columns:36px 1fr 1fr 48px;gap:8px;align-items:center;margin:8px 0}
.set .n{font-family:Anton,sans-serif;font-size:20px;text-align:center}
.set.done .field{background:var(--paper2)}
.ck{width:48px;height:48px;border-radius:6px;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;color:var(--ink)}
.ck svg{width:24px;height:24px}.set.done .ck{background:var(--ink);color:var(--paper)}
.exfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.card.ex.current{border-color:var(--red);box-shadow:none}.card.ex.alldone{opacity:.7}
.ex h3{font-size:18px;flex:1;display:flex;align-items:center;gap:8px}
.idx{font-family:Anton,sans-serif;font-size:20px;color:var(--red);font-weight:400}
.imgbtn{border:0;background:none;padding:0}
.tip{font-size:15px;color:var(--sub);margin:10px 0;font-weight:600}.tip.up{color:var(--ok);font-weight:800}.tip.down{color:var(--bad);font-weight:800}
.plate{display:inline-block;font-size:14px;font-weight:800;border:1.5px solid var(--ink);border-radius:4px;padding:3px 10px;margin:0 0 10px}
.th{position:relative;display:inline-block;width:56px;height:56px;border-radius:4px;overflow:hidden;background:#fff;border:2px solid var(--ink);flex:none}
.th.s{width:46px;height:46px}.th.noimg{background:var(--paper2)}.th.noimg img{display:none}
.th img,.fphoto img,.motion figure img{filter:grayscale(1) contrast(1.15) brightness(1.05)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th img+img{opacity:0;animation:motionFade 2.1s linear infinite}
@keyframes motionFade{0%,33%{opacity:0}50%,83%{opacity:1}100%{opacity:0}}
.motion{position:relative;width:100%;aspect-ratio:3/2;border-radius:6px;background:#fff;border:2px solid var(--ink);overflow:hidden;margin:0 0 14px}
.motion-frames{position:absolute;inset:0}.motion figure{position:absolute;inset:0;margin:0}
.motion figure img{width:100%;height:100%;object-fit:contain}
.motion figure:last-child{opacity:0;animation:motionFade 2.1s linear infinite}.motion figcaption{display:none}
.motion-info{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-weight:900;font-size:18px;z-index:2}
.muscle-map{position:absolute;right:8px;bottom:8px;width:88px;padding:4px;background:var(--card);border:2px solid var(--ink);border-radius:6px;color:var(--ink);font:inherit}
.muscle-map svg{display:block;width:100%;height:auto}.muscle-map small{display:block;font-size:13px;text-align:center;line-height:16px}
.list{list-style:none;margin:12px 0 0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #C9D4E2;font-weight:700}
.list li b{width:22px;font-family:Anton,sans-serif;color:var(--red);font-weight:400}.list li.x{color:var(--sub)}
.item{padding:12px 0;border-top:1px solid #C9D4E2}.item .sub{margin-top:4px;line-height:1.6}
table{width:100%;border-collapse:collapse}td{padding:10px 4px;border-top:1px solid #C9D4E2;font-size:15px}.num{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.stat{padding:12px 10px;min-width:0;border-left:2px solid var(--ink);background:var(--card)}.stat:first-child{border-left:0}
.stat b{display:block;font-family:Anton,"Arial Narrow",sans-serif;font-weight:400;font-size:32px;line-height:1.1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:13px;color:var(--sub);font-weight:700}
.big{font-family:Anton,"Arial Narrow",sans-serif;font-weight:400;font-size:64px;line-height:1;letter-spacing:.01em}.big small{font-size:22px;color:var(--sub);margin-left:4px}
.prog{height:14px;background:var(--card);border:2px solid var(--ink);border-radius:3px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--red) 0 12px,#1440CC 12px 14px);transition:width .3s}
.heat{display:grid;grid-auto-flow:column;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));gap:3px;margin-top:14px;aspect-ratio:12/7.2}
.heat button{-webkit-appearance:none;appearance:none;padding:0;border:0;display:block;min-width:0;min-height:0;border-radius:2px;background:var(--paper2);cursor:pointer}.heat button:disabled{cursor:default}.heat button.pick{outline:3px solid var(--ink);outline-offset:1px;box-shadow:inset 0 0 0 2px #FFC400}.heat button:focus-visible{outline:3px solid #1F5BFF;outline-offset:1px}
.heat-cap{font-size:14px;color:var(--sub);margin:6px 0 0;font-weight:700}.heat-key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--sub);font-weight:700}.heat-key span{display:flex;align-items:center;gap:6px}.heat-key i{width:13px;height:13px;border-radius:2px;background:var(--paper2);box-shadow:inset 0 0 0 1px #9AA8BA}.heat-key i.l1{background:#A9C1FF;box-shadow:none}.heat-key i.l2{background:#1F5BFF;box-shadow:none}.heat-key i.l3{background:#0B0F1A;box-shadow:none}
.heat-day{background:var(--card);border:1px solid #C9D4E2;border-radius:6px;padding:12px 14px;margin-top:12px;font-size:15px}.heat-day ul{margin:6px 0 0;padding-left:18px;line-height:1.7}
.heat button.l1{background:#A9C1FF}.heat button.l2{background:#1F5BFF}.heat button.l3{background:#0B0F1A}.heat button.f{background:transparent}.heat button.now{outline:2px solid var(--ink);outline-offset:1px}
.lift{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #C9D4E2}.lift>div:last-child{width:110px;flex:none}
.achievements{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:4px 2px}
.badge .ic{display:block;margin:0 auto 6px}


.badge b{display:block;font-size:13px;line-height:1.35}.badge small{display:block;font-size:13px;color:var(--sub);line-height:1.35;margin-top:2px}
details{border-top:1px solid #C9D4E2}
.card>details:first-of-type,.card>.h+details{border-top:0}
summary{list-style:none;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:16px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-family:Anton,sans-serif;font-size:22px;line-height:1;flex:none}
details[open] summary:after{content:"\2212"}
details ul,details ol,details p{margin:0 0 12px;padding-left:20px;font-size:15px;line-height:1.7;color:#1E2633}
.rline{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #C9D4E2}.rname{flex:1;font-weight:700;font-size:15px;min-width:0}
#ov{position:fixed;inset:0;background:rgba(11,15,26,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}#ov.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;background:var(--paper);border-top:3px solid var(--ink);border-radius:10px 10px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:61;max-width:560px;margin:0 auto}
#sheet.show{transform:none}#sheet h2{font-size:24px;margin:8px 0 10px;font-weight:900}
.grab{width:44px;height:5px;border-radius:2px;background:var(--ink);margin:4px auto 10px}
.menu-item{display:flex;align-items:center;width:100%;min-height:54px;border:0;border-bottom:1.5px solid var(--ink);background:none;font-size:17px;font-weight:700;text-align:left;padding:0 4px}
.menu-item:disabled{color:#9AA8BA}
.why{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.swaprow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:10px;margin:8px 0}
.swaprow>span:not(.th){display:flex;flex-direction:column;font-weight:800;font-size:16px;min-width:0}
.swaprow small{font-size:13px;color:var(--sub);font-weight:500}
#toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);border-radius:6px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s;z-index:70}
#toast.show{opacity:1;pointer-events:auto;transform:none}#toast .chipbtn{background:var(--paper);color:var(--ink)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--ink);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:50;border-top:4px solid var(--sun)}
#nav button{flex:1;min-height:52px;border:0;border-radius:4px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#B8C4D6;font-size:13px;font-weight:800}
#nav svg{width:22px;height:22px}
#nav button.on{background:var(--sun);color:var(--ink)}
body.in-workout #nav{display:none}body.in-workout{padding-bottom:0}
#restDock{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:55;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:8px 8px 8px 16px;font-weight:800}
#restDock[hidden]{display:none}#restDock button{min-height:44px;border:2px solid var(--sun);border-radius:4px;background:var(--sun);color:var(--ink);font-weight:900;padding:0 14px}
.ring{position:relative;display:grid;place-items:center;flex:none;margin:0 auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .c{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center}
.ring .c b{font-family:Anton,sans-serif;font-weight:400;font-size:28px;line-height:1.1}.ring .c span{font-size:13px;color:var(--sub);font-weight:700}
.round-number{font-family:Anton,"Arial Narrow",sans-serif!important;font-weight:400!important;font-size:76px!important;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.round-label,.round-count{font-size:14px!important;color:var(--sub);font-weight:800}
.rest-ended .round-number{color:var(--red)}
.roundhero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin:8px 0}
.roundhero p{margin:0;font-weight:800}
.rest-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;width:100%}.rest-actions .btn{min-width:0}.cta{padding-right:20px}.rest-actions[hidden]{display:none}.rest-actions .btn{margin:0}
.rest-hint{text-align:center;font-size:14px;color:var(--sub);margin:14px 0 0;font-weight:600}
.result{text-align:center;padding-top:6px}.result h2{font-size:30px;margin:10px 0 4px}.result p{color:var(--sub);margin:0 0 10px}
.stamp{display:grid;place-items:center;width:132px;height:132px;margin:6px auto;border-radius:50%;border:4px double var(--red);color:var(--red);transform:rotate(-8deg);text-align:center;line-height:1}
.stamp b{font-weight:900;font-size:30px;letter-spacing:-.02em}.stamp small{display:block;font-size:13px;font-weight:900;margin-top:4px}
.pr{display:flex;align-items:center;gap:10px;background:#FFE27A;border:0;border-radius:6px;padding:10px 12px;margin-top:10px;font-weight:800;text-align:left}
.pr:before{content:"최고 기록";flex:none;font-size:13px;font-weight:900;color:#fff;background:var(--red);border-radius:3px;padding:3px 6px}
.ic{display:inline-block;flex:none;vertical-align:middle}
.xpburst{position:fixed;left:50%;top:40%;z-index:101;pointer-events:none;background:var(--sun);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:6px;padding:8px 16px;font-size:24px;font-weight:900;animation:coinup .8s ease-out forwards}
.xpburst .ic{vertical-align:-4px}
@keyframes coinup{0%{opacity:0;transform:translate(-50%,10px) rotate(-6deg) scale(.8)}20%{opacity:1;transform:translate(-50%,0) rotate(-6deg) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50px) rotate(-6deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}
.anim>*{animation:up .3s ease-out both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.days.three{grid-template-columns:repeat(3,1fr)}
.day{min-height:52px;border-radius:6px;border:2px solid var(--ink);background:var(--card);font-weight:900;font-size:15px}
.day.next{background:var(--ink);color:var(--paper)}.day small{display:block;font-size:13px;font-weight:600}
.hero{display:flex;align-items:center;gap:14px}
.ic-stamp{display:block;margin:8px auto 10px}
.guide{text-align:center}.guide p{color:var(--sub);margin:0;font-family:Anton,sans-serif;font-size:18px}.guide h2{font-size:22px;line-height:1.45}
.chart{display:block;width:100%;height:auto;margin-top:10px}
.wt-legend{font-size:13px;color:var(--sub);margin-top:6px}.forecast{margin-top:12px;font-size:15px;font-weight:800;background:#FFE27A;border:0;border-radius:6px;padding:12px 14px;line-height:1.5}
.report-line{font-size:22px;font-weight:900;margin:8px 0 12px}.report-list{margin:14px 0 6px;padding-left:20px;font-size:15px;line-height:1.75;color:#1E2633}.bars{display:block;width:100%;height:auto;margin-top:10px}
.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin:12px 0 6px}
.wkstrip span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-left:2px solid var(--ink);font-size:14px;font-weight:900;background:var(--card)}
.wkstrip span:first-child{border-left:0}.wkstrip i{display:none}

 const list=DAYS[day].filter((_,i)=>!D.short||i<4);
 D.draft={day,date:today(),startTs:Date.now(),short:D.short,light:D.light,week:w,ex:list.map(def=>{const name=curName(def.n),ex=adj(def,name,name===def.n?def.t:typeOf(name));const s=suggest(ex);const n=setCount(ex,D.light,w);const sets=[];
  for(let i=0;i<n;i++)sets.push({w:String(s.w===''?0:s.w),r:String(ex.hi),done:false,opt:!!(rule(w).opt&&!D.light&&i===2&&ex.s>=3)});
  return{n:ex.n,base:def.n,t:ex.t,sets,hard:false}})};

let feelAsk=null,tickSaveFail=0;
let tEnd=0,tLen=1,restObserver=null,roundVisible=true,notifiedEnd=0;
function restoreTimer(){
 tEnd=D.draft?.restEndTs||0;tLen=D.draft?.restDuration||90;
}
function startTimer(sec){
 if(!D.draft)return;
 const oldStart=D.draft.restStartTs,oldEnd=D.draft.restEndTs,oldDuration=D.draft.restDuration;
 D.draft.restStartTs=Date.now();D.draft.restEndTs=Date.now()+sec*1000;D.draft.restDuration=sec;
 if(!save()){D.draft.restStartTs=oldStart;D.draft.restEndTs=oldEnd;D.draft.restDuration=oldDuration;return}
 restoreTimer();notifiedEnd=0;tick();
}
function extendTimer(){
 if(!D.draft||!tEnd)return;
 const oldEnd=D.draft.restEndTs,oldDuration=D.draft.restDuration;
 if(D.draft.restStartTs&&Math.max(tEnd,Date.now())+30000-D.draft.restStartTs>3600000)return;

 D.draft.restDuration=D.draft.restStartTs?Math.round((D.draft.restEndTs-D.draft.restStartTs)/1000):Math.max(tLen,Math.ceil((D.draft.restEndTs-Date.now())/1000));
 if(!save()){D.draft.restEndTs=oldEnd;D.draft.restDuration=oldDuration;return}
 restoreTimer();notifiedEnd=0;tick();
}
function stopTimer(){
 if(D.draft){const end=D.draft.restEndTs,len=D.draft.restDuration;D.draft.restEndTs=0;D.draft.restDuration=0;if(!save()){D.draft.restEndTs=end;D.draft.restDuration=len;return}}
 tEnd=0;tLen=1;notifiedEnd=0;tick();
}

  restObserver=new IntersectionObserver(entries=>{roundVisible=entries[0].isIntersecting;tick()},{threshold:0,rootMargin:'0px 0px -170px 0px'});

<details><summary>헬스장에서는 이렇게 해요</summary><ul><li>자전거를 5분 타며 몸을 풀어요.</li><li>바벨 운동 전에는 가벼운 무게로 2세트 준비해요.</li><li>스쿼트는 맨몸 10회, 빈 봉 5회로 시작해요.</li><li>스쿼트 안전바는 가장 깊이 앉았을 때 봉보다 조금 낮게 맞춰요.</li><li>벤치프레스도 안전바를 먼저 확인해요.</li><li>세트를 완료하면 휴식 타이머가 시작돼요.</li><li>${REST_GUIDE}</li><li>운동 뒤에는 말할 수 있을 정도의 빠르기로 20분 걸어요.</li><li>마지막으로 5분 동안 스트레칭해요.</li></ul></details>

<details><summary>회사에서도 가볍게 움직여요</summary><ul><li>한 시간마다 일어나 2~3분 걸어요.</li><li>점심 뒤에는 아프지 않은 범위에서 5분 스트레칭해요.</li><li>문틀에 손을 대고 가슴을 30초씩 두 번 늘려요.</li><li>한쪽 무릎을 꿇고 엉덩이에 힘을 줘 고관절 앞을 늘려요. 허리를 젖히지 않아요.</li><li>고개를 숙이지 않고 턱을 수평으로 뒤로 당겨요.</li></ul></details>
<details><summary style="color:var(--bad)">이럴 때는 잠깐 멈춰요</summary><ul><li>가슴이 아프거나 어지럽거나 숨이 심하게 차면 운동을 멈춰요.</li><li>가슴 통증이 몇 분 넘게 이어지거나 쓰러지거나 숨쉬기 힘들면 바로 119에 연락해요.</li><li>예상보다 심한 근육통, 콜라처럼 진한 소변, 심한 팔다리 힘 빠짐이 하나라도 있으면 바로 병원에 가요.</li><li>관절이 찌르듯 아프거나 저리면 그 운동을 멈춰요.</li></ul></details></div>
